<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HORNET TECH NX // HIGH-PERFORMANCE HUB</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Orbitron & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        display: ['"Orbitron"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace']
                    },
                    colors: {
                        racing: { 
                            500: '#ff003c', 
                            600: '#d90429', 
                            700: '#ef233c',
                        },
                        cyber: {
                            400: '#00f0ff',
                            500: '#0284c7',
                        },
                        dark: {
                            bg: '#05070a',
                            card: '#0d1117',
                            border: '#1f293d'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #05070a; }
        ::-webkit-scrollbar-thumb { background: #ff003c; border-radius: 9999px; }
        
        .aggressive-grid-bg {
            background-color: #05070a;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 0, 60, 0.12) 0%, transparent 60%),
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }

        .glass-panel {
            background: rgba(13, 17, 23, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .glass-modal {
            background: rgba(8, 12, 18, 0.96);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 0, 60, 0.3);
        }

        .neon-glow-red {
            box-shadow: 0 0 25px -5px rgba(255, 0, 60, 0.5);
        }

        .neon-glow-cyan {
            box-shadow: 0 0 20px -5px rgba(0, 240, 255, 0.4);
        }

        .cyber-border {
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
        }
    </style>
</head>
<body class="aggressive-grid-bg text-slate-100 font-sans antialiased min-h-screen flex flex-col selection:bg-racing-500 selection:text-white">

    <!-- Top Diagnostics Banner -->
    <div class="bg-black/90 border-b border-racing-500/30 text-[10px] font-mono text-slate-400 py-1.5 px-4 hidden sm:block uppercase tracking-widest">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <span class="flex items-center text-racing-500 font-bold"><i class="fa-solid fa-bolt mr-1.5 animate-pulse"></i> HIGH PERFORMANCE DIAGNOSTICS PLATFORM</span>
                <span class="text-slate-800">|</span>
                <span class="flex items-center text-cyber-400"><i class="fa-solid fa-microchip mr-1.5"></i> PGM-FI ENGINE MAPPING ACTIVE</span>
            </div>
            <div class="flex items-center space-x-3 text-slate-500">
                <span>SYSTEM STATUS: <span class="text-emerald-400 font-bold">ONLINE</span></span>
            </div>
        </div>
    </div>

    <!-- Main Header -->
    <header class="sticky top-0 z-50 glass-panel border-b border-slate-800/80 shadow-2xl">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <button id="header-back-btn" onclick="goHome()" class="hidden p-2.5 rounded-xl bg-slate-900 hover:bg-racing-500 text-slate-300 hover:text-white transition-all duration-300 border border-slate-700 items-center justify-center shrink-0 group">
                    <i class="fa-solid fa-arrow-left text-sm group-hover:-translate-x-1 transition-transform"></i>
                </button>

                <div onclick="goHome()" class="flex items-center space-x-3.5 cursor-pointer group">
                    <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-racing-500 via-slate-900 to-cyber-400 p-[1px] shadow-lg group-hover:scale-105 transition-transform duration-300">
                        <div class="w-full h-full bg-black rounded-[11px] flex items-center justify-center text-racing-500 group-hover:text-cyber-400 transition-colors">
                            <i class="fa-solid fa-gauge-high text-2xl group-hover:rotate-12 transition-transform duration-300"></i>
                        </div>
                    </div>
                    <div>
                        <div class="flex items-center space-x-1">
                            <span class="text-2xl font-black font-display tracking-wider bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent leading-none">HORNET</span>
                            <span class="text-2xl font-black font-display text-cyber-400 leading-none">NX</span>
                        </div>
                        <span class="text-[9px] font-mono font-bold text-racing-500 tracking-widest uppercase flex items-center mt-1">
                            TECHNICAL PERFORMANCE ARCHIVE
                        </span>
                    </div>
                </div>
            </div>
            
            <!-- Navigation Tabs -->
            <nav id="nav-tabs-container" class="hidden md:flex space-x-1.5 bg-black/80 p-1.5 rounded-xl border border-slate-800">
                <button onclick="switchTab('all')" id="btn-all" class="tab-btn px-4 py-2 rounded-lg text-xs font-bold transition-all duration-300 bg-racing-500 text-white shadow-lg flex items-center space-x-1.5">
                    <i class="fa-solid fa-layer-group text-[11px]"></i><span>ALL ARTICLES</span>
                </button>
                <button onclick="switchTab('article')" id="btn-article" class="tab-btn px-4 py-2 rounded-lg text-xs font-bold transition-all duration-300 text-slate-400 hover:text-white hover:bg-slate-800 flex items-center space-x-1.5">
                    <i class="fa-solid fa-wrench text-[11px]"></i><span>TECH GUIDES</span>
                </button>
                <button onclick="switchTab('vlog')" id="btn-vlog" class="tab-btn px-4 py-2 rounded-lg text-xs font-bold transition-all duration-300 text-slate-400 hover:text-white hover:bg-slate-800 flex items-center space-x-1.5">
                    <i class="fa-solid fa-circle-play text-[11px]"></i><span>MOTO VLOGS</span>
                </button>
                <button onclick="switchTab('pic')" id="btn-pic" class="tab-btn px-4 py-2 rounded-lg text-xs font-bold transition-all duration-300 text-slate-400 hover:text-white hover:bg-slate-800 flex items-center space-x-1.5">
                    <i class="fa-solid fa-images text-[11px]"></i><span>GARAGE GALLERY</span>
                </button>
            </nav>

            <div class="flex items-center space-x-3">
                <div id="auth-action-container">
                    <button onclick="openLoginModal()" id="login-nav-btn" class="text-xs font-bold uppercase tracking-wider px-4 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-white transition-all duration-300 border border-slate-700 flex items-center space-x-2 shrink-0 shadow-md">
                        <i class="fa-solid fa-user-shield text-cyber-400"></i>
                        <span>ADMIN LOGIN</span>
                    </button>
                </div>
                <button onclick="openModal()" id="create-post-nav-btn" class="hidden bg-gradient-to-r from-racing-500 to-racing-600 hover:from-racing-600 hover:to-racing-700 text-white font-bold px-4 py-2.5 rounded-xl text-xs uppercase tracking-wider transition-all duration-300 neon-glow-red hover:scale-105 items-center space-x-2 shrink-0 border border-racing-500/50">
                    <i class="fa-solid fa-plus text-xs"></i>
                    <span>PUBLISH ARTICLE</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 py-8 w-full">
        <div id="feed-view">
            <!-- Mobile Filter Buttons -->
            <div id="mobile-filter-container" class="flex md:hidden overflow-x-auto space-x-2 mb-6 pb-2 scrollbar-none w-full">
                <button onclick="switchTab('all')" id="m-btn-all" class="m-tab-btn px-4 py-2 rounded-xl text-xs font-bold uppercase whitespace-nowrap bg-racing-500 text-white shadow-md">All Articles</button>
                <button onclick="switchTab('article')" id="m-btn-article" class="m-tab-btn px-4 py-2 rounded-xl text-xs font-bold uppercase whitespace-nowrap bg-slate-900 text-slate-400 border border-slate-800">Tech Guides</button>
                <button onclick="switchTab('vlog')" id="m-btn-vlog" class="m-tab-btn px-4 py-2 rounded-xl text-xs font-bold uppercase whitespace-nowrap bg-slate-900 text-slate-400 border border-slate-800">Moto Vlogs</button>
                <button onclick="switchTab('pic')" id="m-btn-pic" class="m-tab-btn px-4 py-2 rounded-xl text-xs font-bold uppercase whitespace-nowrap bg-slate-900 text-slate-400 border border-slate-800">Garage Gallery</button>
            </div>

            <!-- Feed Grid -->
            <div id="feed-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8">
                <!-- Content Cards -->
            </div>
        </div>

        <div id="detail-view" class="hidden max-w-4xl mx-auto">
            <button onclick="goHome()" class="mb-6 inline-flex items-center space-x-2 text-xs font-bold uppercase tracking-wider px-4 py-2.5 rounded-xl bg-slate-900 hover:bg-racing-500 text-slate-300 hover:text-white border border-slate-800 transition-all duration-300 shadow-xl group">
                <i class="fa-solid fa-arrow-left group-hover:-translate-x-1 transition-transform"></i>
                <span>BACK TO FEED</span>
            </button>
            <div id="detail-content-container"></div>
        </div>
    </main>

    <!-- Modals -->
    <!-- Admin Login Modal -->
    <div id="login-modal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden items-center justify-center p-4">
        <div class="glass-modal w-full max-w-md rounded-2xl p-6 sm:p-8 shadow-2xl relative border border-racing-500/40">
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-racing-500/20 border border-racing-500/40 flex items-center justify-center text-racing-500">
                        <i class="fa-solid fa-user-shield text-lg"></i>
                    </div>
                    <h3 class="text-base font-bold font-display uppercase tracking-wider text-slate-100">Admin Portal Login</h3>
                </div>
                <button onclick="closeLoginModal()" class="w-8 h-8 rounded-full bg-slate-900 hover:bg-slate-800 flex items-center justify-center text-slate-400 hover:text-white transition-colors"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest text-slate-400 mb-2 font-mono">Admin Username</label>
                    <input type="text" id="admin-user" required placeholder="Enter username..." class="w-full bg-black border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-racing-500 text-slate-200 placeholder-slate-600 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest text-slate-400 mb-2 font-mono">Security Key</label>
                    <input type="password" id="admin-password" required placeholder="Enter password..." class="w-full bg-black border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-racing-500 text-slate-200 placeholder-slate-600 transition-all">
                    <p id="login-error" class="text-racing-500 text-xs mt-2 hidden flex items-center font-semibold"><i class="fa-solid fa-triangle-exclamation mr-1.5"></i> Access Denied. Invalid credentials.</p>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-racing-500 to-racing-600 hover:from-racing-600 hover:to-racing-700 text-white font-bold py-3.5 rounded-xl text-xs uppercase tracking-widest transition-all duration-300 neon-glow-red mt-2">AUTHENTICATE ADMIN</button>
            </form>
        </div>
    </div>

    <!-- Create/Edit Article Modal -->
    <div id="create-modal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden items-center justify-center p-4 overflow-y-auto">
        <div class="glass-modal w-full max-w-xl rounded-2xl p-6 sm:p-8 shadow-2xl relative my-auto border border-racing-500/40">
            <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-800">
                <button type="button" onclick="closeModal()" class="text-xs font-bold px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition-all border border-slate-700 flex items-center space-x-1.5 uppercase">
                    <i class="fa-solid fa-arrow-left text-[10px]"></i>
                    <span>Back</span>
                </button>
                <h3 class="text-base font-bold font-display uppercase tracking-wider text-slate-100" id="modal-heading">PUBLISH ARTICLE</h3>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-900 hover:bg-slate-800 flex items-center justify-center text-slate-400 hover:text-white transition-colors"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <form id="post-form" onsubmit="handlePostSubmit(event)" class="space-y-4">
                <input type="hidden" id="edit-post-id">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest text-slate-400 mb-2 font-mono">Category</label>
                    <select id="post-type" onchange="toggleFormFields()" class="w-full bg-black border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-racing-500 text-slate-200">
                        <option value="article">Tech Guide / Maintenance Specs</option>
                        <option value="vlog">Moto Vlog / Dyno Test Video</option>
                        <option value="pic">Garage / Component Photography</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest text-slate-400 mb-2 font-mono">Title</label>
                    <input type="text" id="post-title" required placeholder="Article title..." class="w-full bg-black border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-racing-500 text-slate-200 placeholder-slate-600">
                </div>
                
                <div id="media-url-container" class="hidden">
                    <label class="block text-xs font-bold uppercase tracking-widest text-slate-400 mb-2 font-mono">Video Embed URL (YouTube)</label>
                    <input type="url" id="post-media-url" placeholder="https://www.youtube.com/embed/..." class="w-full bg-black border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-racing-500 text-slate-200 placeholder-slate-600">
                </div>

                <!-- Mandatory/Optional Photo Upload for ALL Sections -->
                <div id="media-file-container" class="block">
                    <label class="block text-xs font-bold uppercase tracking-widest text-slate-400 mb-2 font-mono" id="photo-upload-label">Upload Article Cover / Media Photo</label>
                    <input type="file" id="post-media-file" accept="image/*" class="w-full bg-black border border-slate-800 rounded-xl px-3 py-2 text-xs file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-racing-500 file:text-white hover:file:bg-racing-600 text-slate-400 cursor-pointer">
                    <input type="hidden" id="existing-media-data">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest text-slate-400 mb-2 font-mono">Technical Description / Instructions</label>
                    <textarea id="post-content" rows="5" required placeholder="Enter full text content..." class="w-full bg-black border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-racing-500 text-slate-200 placeholder-slate-600"></textarea>
                </div>
                <div class="flex items-center space-x-3 pt-3">
                    <button type="button" onclick="closeModal()" class="w-1/3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl text-xs uppercase tracking-wider transition-all">Cancel</button>
                    <button type="submit" id="form-submit-btn" class="w-2/3 bg-gradient-to-r from-racing-500 to-racing-600 hover:from-racing-600 hover:to-racing-700 text-white font-bold py-3 rounded-xl text-xs uppercase tracking-widest transition-all duration-300 neon-glow-red">Publish Article</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="border-t border-slate-800/80 mt-auto py-8 text-center text-xs text-slate-500 bg-black/90">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-2 text-slate-400 text-[11px] font-bold">
                <i class="fa-solid fa-motorcycle text-racing-500"></i>
                <span>HORNET & NX TECHNICAL PERFORMANCE ARCHIVE</span>
            </div>
            <p class="flex items-center justify-center space-x-1 font-mono">
                <span>&copy; 2026 HornetTech NX. Authored by</span>
                <span class="text-cyber-400 font-bold">Utsha</span>.
            </p>
        </div>
    </footer>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCbgkiGX1B3-unb900ksJM0mNVQd1LLed0",
            authDomain: "hornet-tech.firebaseapp.com",
            projectId: "hornet-tech",
            storageBucket: "hornet-tech.firebasestorage.app",
            messagingSenderId: "1043158744040",
            appId: "1:1043158744040:web:3c5a8085ade58fc0f7025d",
            measurementId: "G-PDRN3VWDMB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const postsRef = collection(db, "posts");

        const ADMIN_USER = "utsha";
        const ADMIN_PASS = "hornet2";

        window.isAdmin = localStorage.getItem('nexus_is_admin') === 'true';
        window.posts = [];
        window.currentTab = 'all';
        window.currentPostId = null;

        const q = query(postsRef, orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            window.posts = snapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
            }));
            if (window.currentPostId) {
                openArticle(window.currentPostId);
            } else {
                renderFeed();
            }
        });

        window.updateAuthUI = function() {
            const authContainer = document.getElementById('auth-action-container');
            const createBtn = document.getElementById('create-post-nav-btn');

            if (window.isAdmin) {
                authContainer.innerHTML = `<button onclick="handleLogout()" class="text-xs font-bold uppercase tracking-wider px-4 py-2.5 rounded-xl bg-red-950/40 hover:bg-red-900/60 text-racing-500 border border-red-800/50 flex items-center space-x-2 shrink-0"><i class="fa-solid fa-lock-open text-[10px]"></i><span>Logout Admin</span></button>`;
                createBtn.classList.remove('hidden');
                createBtn.classList.add('flex');
            } else {
                authContainer.innerHTML = `<button onclick="openLoginModal()" id="login-nav-btn" class="text-xs font-bold uppercase tracking-wider px-4 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-white transition-all border border-slate-700 flex items-center space-x-2 shrink-0 shadow-md"><i class="fa-solid fa-user-shield text-cyber-400"></i><span>Admin Login</span></button>`;
                createBtn.classList.remove('flex');
                createBtn.classList.add('hidden');
            }
        };

        window.handleAdminLogin = function(e) {
            e.preventDefault();
            const userInput = document.getElementById('admin-user').value.trim();
            const passInput = document.getElementById('admin-password').value;

            if (userInput === ADMIN_USER && passInput === ADMIN_PASS) {
                window.isAdmin = true;
                localStorage.setItem('nexus_is_admin', 'true');
                closeLoginModal();
                updateAuthUI();
                if(window.currentPostId) openArticle(window.currentPostId);
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        };

        window.handleLogout = function() {
            window.isAdmin = false;
            localStorage.setItem('nexus_is_admin', 'false');
            updateAuthUI();
            if(window.currentPostId) {
                openArticle(window.currentPostId);
            } else {
                renderFeed();
            }
        };

        window.renderFeed = function() {
            document.getElementById('feed-view').classList.remove('hidden');
            document.getElementById('detail-view').classList.add('hidden');
            document.getElementById('mobile-filter-container').classList.remove('hidden');
            document.getElementById('header-back-btn').classList.add('hidden');
            document.getElementById('header-back-btn').classList.remove('flex');
            window.currentPostId = null;

            const grid = document.getElementById('feed-grid');
            grid.innerHTML = '';

            const filteredPosts = window.currentTab === 'all' 
                ? window.posts 
                : window.posts.filter(p => p.type === window.currentTab);

            if (filteredPosts.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-20 text-center glass-panel rounded-2xl border border-slate-800">
                        <div class="w-16 h-16 rounded-2xl bg-slate-900 flex items-center justify-center mx-auto mb-4 text-racing-500 border border-slate-800">
                            <i class="fa-solid fa-folder-open text-2xl"></i>
                        </div>
                        <h4 class="text-slate-200 font-bold mb-1 font-display uppercase tracking-wider">NO ARTICLES PUBLISHED</h4>
                        <p class="text-xs text-slate-500 font-mono">No content available in this section yet.</p>
                    </div>`;
                return;
            }

            filteredPosts.forEach(post => {
                let thumbnailPreview = '';
                if (post.type === 'vlog') {
                    thumbnailPreview = `
                        <div class="overflow-hidden rounded-xl mb-4 h-48 bg-black relative flex items-center justify-center border border-slate-800">
                            ${post.media && !post.media.includes('youtube') ? `<img src="${post.media}" class="w-full h-full object-cover opacity-60">` : `<div class="absolute inset-0 opacity-40 bg-gradient-to-tr from-racing-600 via-black to-cyber-500"></div>`}
                            <div class="w-12 h-12 rounded-full bg-racing-500 text-white flex items-center justify-center shadow-lg z-10 group-hover:scale-110 transition-transform duration-300">
                                <i class="fa-solid fa-play ml-1 text-base"></i>
                            </div>
                            <span class="absolute bottom-3 right-3 px-2 py-0.5 rounded text-[10px] font-bold font-mono bg-black/90 text-cyber-400 border border-cyber-400/30">MOTO VLOG</span>
                        </div>`;
                } else {
                    // For both Tech Guides and Garage Gallery
                    if (post.media) {
                        thumbnailPreview = `<div class="overflow-hidden rounded-xl mb-4 h-48 bg-black relative border border-slate-800"><img src="${post.media}" alt="${post.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"></div>`;
                    } else {
                        thumbnailPreview = `
                            <div class="overflow-hidden rounded-xl mb-4 h-36 bg-slate-950 p-4 border border-slate-800 flex flex-col justify-between relative">
                                <div class="text-[10px] font-mono font-bold text-cyber-400 uppercase tracking-widest flex items-center"><i class="fa-solid fa-microchip mr-2 text-racing-500"></i> Technical Spec Sheet</div>
                                <p class="text-xs text-slate-400 line-clamp-2 leading-relaxed">${escapeHtml(post.content)}</p>
                            </div>`;
                    }
                }

                const card = document.createElement('div');
                card.className = "group bg-slate-900/80 hover:bg-slate-900 border border-slate-800 hover:border-racing-500/50 rounded-2xl p-5 flex flex-col justify-between shadow-2xl hover:-translate-y-1.5 transition-all duration-300 cursor-pointer backdrop-blur-sm relative overflow-hidden";
                card.onclick = () => openArticle(post.id);
                
                card.innerHTML = `
                    <div class="pt-1">
                        <div class="flex items-center justify-between text-xs text-slate-400 mb-3">
                            <span class="uppercase tracking-widest px-2.5 py-0.5 rounded bg-black font-mono font-bold text-cyber-400 border border-slate-800 text-[10px]">${post.type}</span>
                            <span class="text-[11px] text-slate-500 font-mono"><i class="fa-regular fa-calendar mr-1.5"></i>${post.date}</span>
                        </div>
                        ${thumbnailPreview}
                        <h4 class="font-bold text-base text-slate-100 group-hover:text-racing-500 transition-colors duration-300 line-clamp-2 mb-2 leading-snug font-display">${escapeHtml(post.title)}</h4>
                    </div>
                    <div class="border-t border-slate-800/80 pt-3 mt-4 flex items-center justify-between text-xs text-slate-500">
                        <span class="flex items-center text-[11px] font-bold text-slate-400"><i class="fa-solid fa-user-shield mr-1.5 text-racing-500"></i> ${escapeHtml(post.author)}</span>
                        <span class="flex items-center text-[11px] font-mono bg-black px-2 py-0.5 rounded border border-slate-800"><i class="fa-regular fa-comment mr-1 text-cyber-400"></i> ${(post.comments || []).length}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        };

        window.openArticle = function(postId) {
            const post = window.posts.find(p => p.id === postId);
            if(!post) return;

            window.currentPostId = postId;
            document.getElementById('feed-view').classList.add('hidden');
            document.getElementById('detail-view').classList.remove('hidden');
            document.getElementById('mobile-filter-container').classList.add('hidden');
            document.getElementById('header-back-btn').classList.remove('hidden');
            document.getElementById('header-back-btn').classList.add('flex');

            let mediaHtml = '';
            if (post.type === 'vlog' && post.media && post.media.includes('http')) {
                let embedUrl = post.media;
                if(embedUrl.includes('watch?v=')) embedUrl = embedUrl.replace('watch?v=', 'embed/');
                mediaHtml = `<div class="overflow-hidden rounded-2xl mb-8 h-80 sm:h-[420px] bg-black border border-slate-800 shadow-2xl"><iframe src="${embedUrl}" class="w-full h-full" frameborder="0" allowfullscreen></iframe></div>`;
            } else if (post.media) {
                mediaHtml = `<div class="overflow-hidden rounded-2xl mb-8 bg-black border border-slate-800 max-h-[550px] flex items-center justify-center shadow-2xl"><img src="${post.media}" alt="${post.title}" class="w-full h-full object-contain"></div>`;
            }

            let adminPostActions = window.isAdmin ? `
                <div class="flex items-center space-x-3 mb-6 p-4 rounded-xl bg-slate-900 border border-slate-800 shadow-lg">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider mr-2 font-mono"><i class="fa-solid fa-shield-halved text-cyber-400 mr-1.5"></i> ADMIN CONTROLS:</span>
                    <button onclick="openEditModal('${post.id}')" class="px-3.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-bold text-cyber-400 border border-slate-700 transition-all flex items-center space-x-1.5 uppercase">
                        <i class="fa-solid fa-pen-to-square"></i><span>Edit</span>
                    </button>
                    <button onclick="deletePost('${post.id}')" class="px-3.5 py-1.5 rounded-lg bg-red-950/50 hover:bg-red-900/60 text-xs font-bold text-racing-500 border border-red-900/50 transition-all flex items-center space-x-1.5 uppercase">
                        <i class="fa-solid fa-trash"></i><span>Delete</span>
                    </button>
                </div>` : '';

            let commentsHtml = (post.comments || []).map((c, index) => {
                let commentPhotoHtml = c.media ? `<div class="mt-3 overflow-hidden rounded-xl max-w-xs max-h-52 bg-black border border-slate-800"><img src="${c.media}" class="w-full h-full object-cover"></div>` : '';
                
                let repliesHtml = (c.replies || []).map((r, rIndex) => `
                    <div class="mt-2.5 pl-3 border-l-2 border-cyber-400 bg-black p-3 rounded-r-xl flex items-start justify-between border-y border-r border-slate-800/80">
                        <div>
                            <span class="font-bold text-cyber-400 text-xs block mb-0.5">${escapeHtml(r.name)}</span>
                            <span class="text-slate-300 text-xs leading-relaxed block">${escapeHtml(r.text)}</span>
                        </div>
                        ${window.isAdmin ? `<button onclick="deleteReply('${post.id}', ${index}, ${rIndex})" class="text-racing-500 hover:text-racing-600 ml-2 px-2 py-1 bg-red-950/40 rounded border border-red-900/50"><i class="fa-solid fa-trash text-[9px]"></i></button>` : ''}
                    </div>
                `).join('');

                return `
                    <div class="bg-black/80 p-4 sm:p-5 rounded-xl border border-slate-800 text-xs mb-3 shadow-xl">
                        <div class="flex items-start justify-between">
                            <div class="w-full">
                                <span class="font-bold text-racing-500 text-sm block mb-1 font-display">${escapeHtml(c.name)}</span> 
                                <span class="text-slate-300 leading-relaxed block text-xs sm:text-sm">${escapeHtml(c.text)}</span>
                                ${commentPhotoHtml}
                            </div>
                            ${window.isAdmin ? `<button onclick="deleteComment('${post.id}', ${index})" class="text-racing-500 hover:text-racing-600 ml-3 px-2 py-1 bg-red-950/40 rounded border border-red-900/50 shrink-0"><i class="fa-solid fa-trash text-[10px]"></i></button>` : ''}
                        </div>
                        
                        <div class="mt-3 flex items-center justify-between border-t border-slate-800/80 pt-2.5">
                            <button onclick="toggleReplyForm(${index})" class="text-[11px] text-cyber-400 hover:text-cyber-300 font-bold flex items-center space-x-1.5 uppercase">
                                <i class="fa-solid fa-reply text-[10px]"></i>
                                <span>Reply</span>
                            </button>
                        </div>

                        ${repliesHtml ? `<div class="mt-3 space-y-2">${repliesHtml}</div>` : ''}

                        <form id="reply-form-${index}" onsubmit="handleAddReply(event, '${post.id}', ${index})" class="hidden mt-3 pt-3 border-t border-slate-800 space-y-2">
                            <div class="flex flex-col sm:flex-row gap-2">
                                <input type="text" placeholder="Your Name" required class="reply-name sm:w-1/3 bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-cyber-400 text-slate-200 placeholder-slate-600">
                                <input type="text" placeholder="Write a reply..." required class="reply-text sm:w-2/3 bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-cyber-400 text-slate-200 placeholder-slate-600">
                            </div>
                            <div class="flex justify-end space-x-2">
                                <button type="button" onclick="toggleReplyForm(${index})" class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-400 hover:text-white text-[11px] font-bold">CANCEL</button>
                                <button type="submit" class="px-3.5 py-1.5 rounded-lg bg-cyber-500 hover:bg-cyber-400 text-white text-[11px] font-bold">SUBMIT REPLY</button>
                            </div>
                        </form>
                    </div>`;
            }).join('');

            const container = document.getElementById('detail-content-container');
            container.innerHTML = `
                ${adminPostActions}
                <article class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 sm:p-10 shadow-2xl mb-8 backdrop-blur-sm relative overflow-hidden">
                    <div class="flex items-center justify-between text-xs text-slate-400 mb-4 font-mono">
                        <span class="uppercase tracking-widest px-3 py-1 rounded bg-black font-bold text-cyber-400 border border-slate-800 text-[10px]">${post.type}</span>
                        <span>Published on ${post.date} by <strong class="text-slate-200">${escapeHtml(post.author)}</strong></span>
                    </div>
                    <h1 class="text-2xl sm:text-4xl font-black font-display text-slate-100 mb-6 leading-tight tracking-tight">${escapeHtml(post.title)}</h1>
                    ${mediaHtml}
                    <div class="text-sm sm:text-base text-slate-300 leading-relaxed whitespace-pre-line space-y-4 mb-4 border-t border-slate-800/80 pt-6">${escapeHtml(post.content)}</div>
                </article>

                <section class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl backdrop-blur-sm">
                    <h3 class="text-lg font-bold font-display mb-6 flex items-center space-x-2.5 text-slate-100 uppercase">
                        <div class="w-8 h-8 rounded-lg bg-racing-500/20 flex items-center justify-center text-racing-500 border border-racing-500/30">
                            <i class="fa-solid fa-comments"></i>
                        </div>
                        <span>Technical Discussion (${(post.comments || []).length})</span>
                    </h3>

                    <form onsubmit="handleAddComment(event, '${post.id}')" class="mb-8 space-y-4 bg-black p-5 rounded-xl border border-slate-800">
                        <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 font-mono">JOIN THE CONVERSATION</h4>
                        <div class="flex flex-col sm:flex-row gap-3">
                            <input type="text" placeholder="Your Name" required class="sm:w-1/3 bg-slate-900 border border-slate-800 rounded-lg px-4 py-2.5 text-xs focus:outline-none focus:border-racing-500 text-slate-200 placeholder-slate-600 comment-name">
                            <input type="text" placeholder="Write your observation or technical comment..." required class="sm:w-2/3 bg-slate-900 border border-slate-800 rounded-lg px-4 py-2.5 text-xs focus:outline-none focus:border-racing-500 text-slate-200 placeholder-slate-600 comment-text">
                        </div>
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pt-1">
                            <div class="flex items-center space-x-2">
                                <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400 font-mono">ATTACH PHOTO:</label>
                                <input type="file" accept="image/*" class="comment-file text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-slate-800 file:text-slate-300 hover:file:bg-slate-700 cursor-pointer">
                            </div>
                            <button type="submit" class="bg-gradient-to-r from-racing-500 to-racing-600 hover:from-racing-600 hover:to-racing-700 text-white font-bold px-5 py-2.5 rounded-lg text-xs uppercase tracking-widest transition-all shadow-md">POST COMMENT</button>
                        </div>
                    </form>

                    <div class="space-y-3 max-h-[500px] overflow-y-auto pr-1">
                        ${commentsHtml || '<p class="text-xs text-slate-500 italic py-6 text-center font-mono">No discussions posted yet.</p>'}
                    </div>
                </section>`;
        };

        window.handleAddComment = async function(e, postId) {
            e.preventDefault();
            const form = e.target;
            const nameInput = form.querySelector('.comment-name');
            const textInput = form.querySelector('.comment-text');
            const fileInput = form.querySelector('.comment-file');

            const post = window.posts.find(p => p.id === postId);
            if (!post) return;

            const saveCommentObj = async (commentMedia) => {
                const newComments = post.comments || [];
                newComments.push({
                    name: nameInput.value.trim(),
                    text: textInput.value.trim(),
                    media: commentMedia || '',
                    replies: []
                });

                await updateDoc(doc(db, "posts", postId), { comments: newComments });
            };

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = async function(uploadEvent) {
                    await saveCommentObj(uploadEvent.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                await saveCommentObj('');
            }
        };

        window.handleAddReply = async function(e, postId, commentIndex) {
            e.preventDefault();
            const form = e.target;
            const nameInput = form.querySelector('.reply-name');
            const textInput = form.querySelector('.reply-text');

            const post = window.posts.find(p => p.id === postId);
            if (!post || !post.comments[commentIndex]) return;

            const updatedComments = [...post.comments];
            if (!updatedComments[commentIndex].replies) updatedComments[commentIndex].replies = [];

            updatedComments[commentIndex].replies.push({
                name: nameInput.value.trim(),
                text: textInput.value.trim()
            });

            await updateDoc(doc(db, "posts", postId), { comments: updatedComments });
        };

        window.deleteComment = async function(postId, commentIndex) {
            if(!window.isAdmin) return;
            const post = window.posts.find(p => p.id === postId);
            if (post) {
                const updatedComments = [...post.comments];
                updatedComments.splice(commentIndex, 1);
                await updateDoc(doc(db, "posts", postId), { comments: updatedComments });
            }
        };

        window.deleteReply = async function(postId, commentIndex, replyIndex) {
            if(!window.isAdmin) return;
            const post = window.posts.find(p => p.id === postId);
            if (post && post.comments[commentIndex]) {
                const updatedComments = [...post.comments];
                updatedComments[commentIndex].replies.splice(replyIndex, 1);
                await updateDoc(doc(db, "posts", postId), { comments: updatedComments });
            }
        };

        window.handlePostSubmit = async function(e) {
            e.preventDefault();
            if (!window.isAdmin) return;

            const submitBtn = document.getElementById('form-submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerText = "PROCESSING...";

            const editId = document.getElementById('edit-post-id').value;
            const type = document.getElementById('post-type').value;
            const title = document.getElementById('post-title').value;
            const content = document.getElementById('post-content').value;

            const proceedSave = async (media) => {
                try {
                    if (editId) {
                        await updateDoc(doc(db, "posts", editId), { type, title, content, media });
                    } else {
                        await addDoc(postsRef, {
                            type,
                            title,
                            content,
                            media: media || '',
                            author: 'Utsha',
                            date: new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }),
                            comments: [],
                            timestamp: Date.now()
                        });
                    }
                    closeModal();
                    goHome();
                } catch (error) {
                    alert("Error saving post: " + error.message);
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerText = editId ? "SAVE CHANGES" : "PUBLISH ARTICLE";
                }
            };

            const fileInput = document.getElementById('post-media-file');
            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    await proceedSave(ev.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else if (type === 'vlog' && document.getElementById('post-media-url').value) {
                await proceedSave(document.getElementById('post-media-url').value);
            } else {
                await proceedSave(document.getElementById('existing-media-data').value);
            }
        };

        window.deletePost = async function(postId) {
            if(!window.isAdmin) return;
            if(confirm('Are you sure you want to delete this technical article?')) {
                await deleteDoc(doc(db, "posts", postId));
                goHome();
            }
        };

        window.toggleReplyForm = function(index) {
            const form = document.getElementById(`reply-form-${index}`);
            if (form) form.classList.toggle('hidden');
        };

        window.openLoginModal = () => {
            document.getElementById('login-modal').classList.remove('hidden');
            document.getElementById('login-modal').classList.add('flex');
        };

        window.closeLoginModal = () => {
            document.getElementById('login-modal').classList.remove('flex');
            document.getElementById('login-modal').classList.add('hidden');
            document.getElementById('login-error').classList.add('hidden');
        };

        window.openModal = () => {
            if(!window.isAdmin) return;
            document.getElementById('edit-post-id').value = '';
            document.getElementById('modal-heading').innerText = 'PUBLISH ARTICLE';
            document.getElementById('form-submit-btn').innerText = 'PUBLISH ARTICLE';
            document.getElementById('post-form').reset();
            document.getElementById('existing-media-data').value = '';
            document.getElementById('create-modal').classList.remove('hidden');
            document.getElementById('create-modal').classList.add('flex');
            toggleFormFields();
        };

        window.openEditModal = (postId) => {
            if(!window.isAdmin) return;
            const post = window.posts.find(p => p.id === postId);
            if(!post) return;

            document.getElementById('edit-post-id').value = post.id;
            document.getElementById('modal-heading').innerText = 'EDIT ARTICLE';
            document.getElementById('form-submit-btn').innerText = 'SAVE CHANGES';
            
            document.getElementById('post-type').value = post.type;
            document.getElementById('post-title').value = post.title;
            document.getElementById('post-content').value = post.content;
            
            if(post.type === 'vlog') {
                document.getElementById('post-media-url').value = post.media || '';
            }
            document.getElementById('existing-media-data').value = post.media || '';

            toggleFormFields();
            document.getElementById('create-modal').classList.remove('hidden');
            document.getElementById('create-modal').classList.add('flex');
        };

        window.closeModal = () => {
            document.getElementById('create-modal').classList.remove('flex');
            document.getElementById('create-modal').classList.add('hidden');
            document.getElementById('post-form').reset();
        };

        window.toggleFormFields = () => {
            const type = document.getElementById('post-type').value;
            const urlContainer = document.getElementById('media-url-container');
            
            if (type === 'vlog') {
                urlContainer.classList.remove('hidden');
            } else {
                urlContainer.classList.add('hidden');
            }
        };

        window.goHome = () => renderFeed();

        window.switchTab = (tab) => {
            window.currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn px-4 py-2 rounded-lg text-xs font-bold transition-all duration-300 text-slate-400 hover:text-white hover:bg-slate-800 flex items-center space-x-1.5";
            });
            const activeBtn = document.getElementById(`btn-${tab}`);
            if(activeBtn) activeBtn.className = "tab-btn px-4 py-2 rounded-lg text-xs font-bold transition-all duration-300 bg-racing-500 text-white shadow-lg flex items-center space-x-1.5";

            document.querySelectorAll('.m-tab-btn').forEach(btn => {
                btn.className = "m-tab-btn px-4 py-2 rounded-xl text-xs font-bold uppercase whitespace-nowrap bg-slate-900 text-slate-400 border border-slate-800";
            });
            const activeMBtn = document.getElementById(`m-btn-${tab}`);
            if(activeMBtn) activeMBtn.className = "m-tab-btn px-4 py-2 rounded-xl text-xs font-bold uppercase whitespace-nowrap bg-racing-500 text-white shadow-md";

            renderFeed();
        };

        function escapeHtml(str) {
            return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        updateAuthUI();
    </script>
</body>
</html>
